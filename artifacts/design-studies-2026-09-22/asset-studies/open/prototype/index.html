<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NeedleBub — A2 Open expression asset study</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pocket">
  <header class="brand"><div class="brand-name"><img src="../../reference/needlebub-mark.svg" alt="" width="30" height="30"><span>NeedleBub</span></div><span class="prototype">Prototype</span></header>
  <h1>One-time codes<span class="title-dot">.</span></h1>
  <section class="console" aria-label="One-time code controls">
    <div class="display" id="display">
      <div class="display-top"><span class="switch-label"><span class="status-dot"></span><span id="mode">Tool is on</span></span><span class="source-count">2 sources</span></div>
      <div class="status-group"><img class="face" id="expression" src="../svg/face-ready-96.svg" width="96" height="48" alt="">
      <div class="status-copy" aria-live="polite"><h2 id="status-title">Ready for codes.</h2><p id="status-description">Watching selected notifications.</p></div></div>
    </div>
    <div class="control-deck">
      <div class="recent"><div class="recent-caption"><span>Today</span><time>Latest: 2 min ago</time></div><div class="activity-summary"><strong>3</strong><span>codes handled</span></div></div>
      <button class="primary" id="primary"><span id="primary-label">View activity</span><img class="glyph" id="primary-glyph" src="../svg/activity.svg" width="20" height="20" alt=""></button>
      <div class="utility-controls"><button id="sources"><img class="glyph" src="../svg/sources.svg" width="20" height="20" alt=""><span>Sources <span class="count">2</span></span></button><button id="pause" aria-pressed="false"><img class="glyph" id="pause-glyph" src="../svg/pause.svg" width="20" height="20" alt=""><span id="pause-label">Pause</span></button></div>
    </div>
  </section>
  <p class="footnote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>No code content saved</p>
</main>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" aria-label="Close details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="sheet-body"></div></dialog>
<script src="script.js"></script>
</body>
</html>
