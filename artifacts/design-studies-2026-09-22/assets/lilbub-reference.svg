<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title id="icon-title">LilBub — happy little polygon</title>
  <desc id="icon-description">A cheerful calico robot head, drawn with broad angular ears, cut corners, a faceted display and smiling eyes. Its head tips slightly to one side.</desc>

  <g id="bub" data-name="Happy pocket Bub" transform="rotate(-4 48 50)">
    <g id="shell" data-name="Faceted calico shell">
      <path id="shell-fill" data-name="Milk shell" d="M13 40 25 19 30 17 45 30 51 30 65 17 70 19 83 40V64L73 77 60 83H36L23 77 13 64Z" fill="#FFFAF1"/>
      <path id="lower-facet" data-name="Lower shell facet" d="M13 59 23 70 37 77H60L73 70 83 59V64L73 77 60 83H36L23 77 13 64Z" fill="#DCD4C8"/>
      <path id="calico-dark" data-name="Charcoal ear patch" d="M13 40 25 19 30 17 45 30 37 38 24 43Z" fill="#282A2F"/>
      <path id="calico-apricot" data-name="Apricot ear patch" d="M51 30 65 17 70 19 83 40 73 43 63 37Z" fill="#DE945F"/>
      <path id="ear-left" data-name="Left ear inset" d="m24 29 5-3 7 7-14 4Z" fill="#F3EFE7"/>
      <path id="ear-right" data-name="Right ear inset" d="m61 33 7-7 5 3 3 8Z" fill="#F3EFE7"/>
      <path id="shell-outline" data-name="Cut-corner silhouette" d="M13 40 25 19 30 17 45 30 51 30 65 17 70 19 83 40V64L73 77 60 83H36L23 77 13 64Z" fill="none" stroke="#282A2F" stroke-width="4" stroke-linejoin="bevel"/>
    </g>
    <g id="display" data-name="Twelve-sided display">
      <path id="screen" data-name="Faceted charcoal screen" d="M38 36H58L68 42 75 52V61L68 71 58 76H38L28 71 21 61V52L28 42Z" fill="#282A2F"/>
      <g id="expression" data-name="Happy squint">
        <path id="eye-left" data-name="Left smiling eye" d="m31 53 5-5h2l5 5" fill="none" stroke="#D1ECC0" stroke-width="4" stroke-linecap="round" stroke-linejoin="bevel"/>
        <path id="eye-right" data-name="Right smiling eye" d="m53 53 5-5h2l5 5" fill="none" stroke="#D1ECC0" stroke-width="4" stroke-linecap="round" stroke-linejoin="bevel"/>
        <path id="nose" data-name="Tiny pink nose" d="M46 58H50L48 60Z" fill="#FFC9C6"/>
        <path id="smile" data-name="Little double smile" d="M41 61C41 69 48 69 48 62C48 69 55 69 55 61" fill="none" stroke="#F3EFE7" stroke-width="3.2" stroke-linecap="round"/>
        <path id="cheek-left" data-name="Left rosy cheek" d="m28 60 4 1" fill="none" stroke="#DDA39D" stroke-width="2.5" stroke-linecap="round"/>
        <path id="cheek-right" data-name="Right rosy cheek" d="m64 61 4-1" fill="none" stroke="#DDA39D" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>