apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-parcelize'

def emulatorRuntimeStub = providers.gradleProperty('needlebubEmulatorRuntimeStub').orNull == 'true'
def releaseSigningPropertiesFile = new File(
    System.getenv('NEEDLEBUB_SIGNING_PROPERTIES') ?:
        new File(System.getenv('USERPROFILE') ?: System.getProperty('user.home'), '.config/needlebub/release/signing.properties').absolutePath
)
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
// versionCode rises on every build (minutes since epoch) unless -PversionCode is given.
def buildMinute = System.currentTimeMillis().intdiv(60000L)
def versionCodeOverride = providers.gradleProperty('versionCode').orNull

android {
    namespace = "de.x0bubbuff.needlebub"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion '23.1.7779620'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    defaultConfig {
        applicationId "de.bubblebuffer.needlebub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt((versionCodeOverride ?: buildMinute).toString())
        versionName "0.1.0-beta.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters emulatorRuntimeStub ? 'x86_64' : 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments "-DNEEDLEBUB_EMULATOR_RUNTIME_STUB=${emulatorRuntimeStub ? 'ON' : 'OFF'}"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    sourceSets {
        main.assets.srcDir '../../catalogue'
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            if (!releaseSigningProperties.isEmpty()) {
                signingConfig = signingConfigs.create('privateBeta') {
                    storeFile = file(releaseSigningProperties.getProperty('storeFile'))
                    storePassword = releaseSigningProperties.getProperty('storePassword')
                    keyAlias = releaseSigningProperties.getProperty('keyAlias')
                    keyPassword = releaseSigningProperties.getProperty('keyPassword')
                }
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name.matches(/(?i).*(assemble|bundle|package).*Release.*/)) {
        task.doFirst {
            if (!releaseSigningPropertiesFile.isFile()) {
                throw new GradleException(
                    "NeedleBub release signing is not configured. Expected ${releaseSigningPropertiesFile}."
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "net.i2p.crypto:eddsa:0.3.0"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
